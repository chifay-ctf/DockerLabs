<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 456" width="1240" height="456">
  <style>
    .bg{fill:#0b1120}.panel{fill:#1e293b;stroke:#334155}
    .ttl{fill:#f8fafc;font:700 23px 'Segoe UI',system-ui,sans-serif}
    .sub{fill:#94a3b8;font:400 13px 'Segoe UI',system-ui,sans-serif}
    .by{fill:#64748b;font:400 11.5px 'Segoe UI',system-ui,sans-serif}.byn{fill:#38bdf8;font:700 11.5px 'Segoe UI',system-ui,sans-serif}
    .bt{fill:#f8fafc;font:700 12.5px 'Segoe UI',system-ui,sans-serif}
    .bc{fill:#38bdf8;font:400 10.5px ui-monospace,Menlo,Consolas,monospace}
    .bn{fill:#f59e0b;font:700 11px 'Segoe UI',system-ui,sans-serif}
    .ar{stroke:#475569;stroke-width:2.5;fill:none}
    .note{fill:#94a3b8;font:400 11.5px 'Segoe UI',system-ui,sans-serif}
    .crit{fill:#ef4444;font:700 13px 'Segoe UI',system-ui,sans-serif}
  </style>
  <rect class="bg" width="1240" height="456"/>
  <text class="ttl" x="20" y="38">ACME Corp — Cadena de ataque completa</text>
  <text class="sub" x="20" y="60">172.17.0.2 · usuario (uid 1000) → root (euid 0) · 2 vectores de escalada independientes</text>

  <!-- stage 1 -->
  <rect class="panel" x="20" y="100" width="170" height="138" rx="10"/>
  <text class="bn" x="32" y="122">FASE 1 · RECON</text>
  <text class="bt" x="32" y="142">nmap -p- -sV</text>
  <text class="bc" x="32" y="162">22/tcp  ssh</text>
  <text class="bc" x="32" y="178">80/tcp  http</text>
  <text class="bc" x="32" y="198">robots.txt →</text>
  <text class="bc" x="32" y="212">migration_notes</text>

  <!-- stage 2 -->
  <rect class="panel" x="226" y="100" width="170" height="138" rx="10" stroke="#ef4444" stroke-width="2"/>
  <text class="bn" x="238" y="122">FASE 2 · CREDS</text>
  <text class="bt" x="238" y="142">Banner SSH</text>
  <text class="bc" x="238" y="162">Banner /etc/issue.net</text>
  <text class="bc" x="238" y="182" fill="#ef4444">usuario:P@ssw0rd...</text>
  <text class="bc" x="238" y="202" fill="#ef4444">¡sin autenticar!</text>

  <!-- stage 3 -->
  <rect class="panel" x="432" y="100" width="170" height="138" rx="10"/>
  <text class="bn" x="444" y="122">FASE 3 · USER</text>
  <text class="bt" x="444" y="142">user.txt</text>
  <text class="bc" x="444" y="162">FLAG{nmap_recon</text>
  <text class="bc" x="444" y="176">ssh_foothold</text>
  <text class="bc" x="444" y="190">_7a9f24e1}</text>
  <text class="bc" x="444" y="212" fill="#22c55e">✔ bandera usuario</text>

  <!-- stage 4 -->
  <rect class="panel" x="638" y="100" width="170" height="138" rx="10" stroke="#ef4444" stroke-width="2"/>
  <text class="bn" x="650" y="122">FASE 4 · SUID</text>
  <text class="bt" x="650" y="142">bash -p</text>
  <text class="bc" x="650" y="162">/usr/bin/bash</text>
  <text class="bc" x="650" y="176">-rwsr-xr-x (4755)</text>
  <text class="bc" x="650" y="196" fill="#ef4444">euid=0(root)</text>
  <text class="bc" x="650" y="212" fill="#22c55e">✔ vector 1</text>

  <!-- stage 5 -->
  <rect class="panel" x="844" y="100" width="170" height="138" rx="10" stroke="#ef4444" stroke-width="2"/>
  <text class="bn" x="856" y="122">FASE 5 · WP/FPM</text>
  <text class="bt" x="856" y="142">plugins/ 777</text>
  <text class="bc" x="856" y="162">127.0.0.1:8080</text>
  <text class="bc" x="856" y="176">127.0.0.1:9000</text>
  <text class="bc" x="856" y="196">FPM user=root</text>
  <text class="bc" x="856" y="212" fill="#22c55e">✔ vector 2</text>

  <!-- stage 6 -->
  <rect class="panel" x="1050" y="100" width="170" height="138" rx="10" stroke="#22c55e" stroke-width="2"/>
  <text class="bn" x="1062" y="122" fill="#22c55e">FASE 6 · ROOT</text>
  <text class="bt" x="1062" y="142">root.txt</text>
  <text class="bc" x="1062" y="162">FLAG{wp2shell</text>
  <text class="bc" x="1062" y="176">cve_2026_63030</text>
  <text class="bc" x="1062" y="190">core_rce_root</text>
  <text class="bc" x="1062" y="204">_99d10c8b}</text>
  <text class="bc" x="1062" y="222" fill="#22c55e">✔ bandera root</text>

  <!-- arrows -->
  <path class="ar" d="M190 166 L222 166"/>
  <path class="ar" d="M396 166 L428 166"/>
  <path class="ar" d="M602 166 L634 166"/>
  <path class="ar" d="M808 166 L840 166"/>
  <path class="ar" d="M1014 166 L1046 166"/>
  <path d="M808 166 L840 166" class="ar"/>

  <rect class="panel" x="20" y="292" width="1200" height="144" rx="10"/>
  <text class="crit" x="36" y="316">HALLAZGO PRINCIPAL</text>
  <text class="note" x="36" y="340">Los vectores 4 y 5 son independientes: cualquiera de los dos basta para llegar a root. El SUID (vector 1) es el más directo.</text>
  <text class="note" x="36" y="362">Un binario de shell con bit SUID (/usr/bin/bash, modo 4755 root:root) es una mala configuración crítica por sí sola.</text>
  <text class="note" x="36" y="382">bash -p conserva el euid efectivo en lugar de reponerlo, de modo que cualquier usuario local obtiene privilegios de root completos.</text>
  <text class="note" x="36" y="402">Verificado: lectura de /root/root.txt, escritura en /root/ y lectura de /etc/shadow. Tambien aplica a /usr/bin/dash.</text>
  <text class="note" x="36" y="422">No se explota ninguna vulnerabilidad de WordPress para la escalada.</text>
</svg>