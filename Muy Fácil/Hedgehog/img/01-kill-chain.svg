<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620">
  <style>
    .bg{fill:#0b1120}.panel{fill:#1e293b;stroke:#334155}
    .term{fill:#020617;stroke:#334155}
    .ttl{fill:#f8fafc;font:700 23px 'Segoe UI',system-ui,sans-serif}
    .sub{fill:#94a3b8;font:400 13px 'Segoe UI',system-ui,sans-serif}
    .bt{fill:#f8fafc;font:700 12.5px 'Segoe UI',system-ui,sans-serif}
    .bc{fill:#38bdf8;font:400 10.5px ui-monospace,Menlo,Consolas,monospace}
    .h{fill:#f8fafc;font:700 13px 'Segoe UI',system-ui,sans-serif}
    .m{fill:#cbd5e1;font:400 11.5px ui-monospace,Menlo,Consolas,monospace}
    .bad{fill:#ef4444;font:700 11.5px ui-monospace,Menlo,Consolas,monospace}
    .bn{fill:#f59e0b;font:700 11px 'Segoe UI',system-ui,sans-serif}
    .ar{stroke:#475569;stroke-width:2.5;fill:none}
    .note{fill:#94a3b8;font:400 11.5px 'Segoe UI',system-ui,sans-serif}
    .crit{fill:#ef4444;font:700 13px 'Segoe UI',system-ui,sans-serif}
    .ok{fill:#22c55e;font:400 11.5px ui-monospace,Menlo,Consolas,monospace}
  </style>
  <rect class="bg" width="1240" height="620"/>
  <text class="ttl" x="20" y="38">Hedgehog — Cadena de ataque</text>
  <text class="sub" x="20" y="60">172.17.0.2 · fuerza bruta SSH y escalada por movimiento entre usuarios</text>

  <!-- flujo principal -->
  <rect class="panel" x="20" y="96" width="170" height="150" rx="10"/>
  <text class="bn" x="32" y="118">FASE 1 · RECON</text>
  <text class="bt" x="32" y="138">nmap -p- -sV</text>
  <text class="bc" x="32" y="158">22/tcp  ssh</text>
  <text class="bc" x="32" y="174">        OpenSSH 9.6p1</text>
  <text class="bc" x="32" y="194">80/tcp  http</text>
  <text class="bc" x="32" y="210">        Apache 2.4.58</text>
  <text class="bc" x="32" y="234">solo 2 puertos</text>

  <rect class="panel" x="226" y="96" width="170" height="150" rx="10" stroke="#f59e0b" stroke-width="2"/>
  <text class="bn" x="238" y="118">FASE 2 · PISTA</text>
  <text class="bt" x="238" y="138">HTTP :80</text>
  <text class="bc" x="238" y="158">index.html</text>
  <text class="bc" x="238" y="176">6 bytes:</text>
  <text class="bc" x="238" y="196" fill="#f59e0b">"tails"</text>
  <text class="bc" x="238" y="216">⇒ usuario</text>
  <text class="bc" x="238" y="234">a atacar</text>

  <rect class="panel" x="432" y="96" width="170" height="150" rx="10" stroke="#ef4444" stroke-width="2"/>
  <text class="bn" x="444" y="118">FASE 3 · BRUTE</text>
  <text class="bt" x="444" y="138">rockyou al revés</text>
  <text class="bc" x="444" y="158">pos. 88 / 497</text>
  <text class="bc" x="444" y="176">16 hilos</text>
  <text class="bc" x="444" y="194">96 intentos</text>
  <text class="bc" x="444" y="212">21,6 s (4/s)</text>
  <text class="bc" x="444" y="230">delay: 3,6 s</text>

  <rect class="panel" x="638" y="96" width="170" height="150" rx="10" stroke="#ef4444" stroke-width="2"/>
  <text class="bn" x="650" y="118">FASE 4 · ACCESO</text>
  <text class="bt" x="650" y="138">ssh tails@…</text>
  <text class="bc" x="650" y="158">id:</text>
  <text class="bc" x="650" y="176">uid=1002(tails)</text>
  <text class="bc" x="650" y="196">sin sudo de root</text>
  <text class="bc" x="650" y="214">pero sí para</text>
  <text class="bc" x="650" y="232">sudo -u sonic</text>

  <rect class="panel" x="844" y="96" width="170" height="150" rx="10" stroke="#ef4444" stroke-width="2"/>
  <text class="bn" x="856" y="118">FASE 5 · PIVOTE</text>
  <text class="bt" x="856" y="138">sudo -u sonic</text>
  <text class="bc" x="856" y="158">id:</text>
  <text class="bc" x="856" y="176">uid=1001(sonic)</text>
  <text class="bc" x="856" y="196">sonic tiene</text>
  <text class="bc" x="856" y="212">(ALL) NOPASSWD</text>
  <text class="bc" x="856" y="234">⇒ root</text>

  <rect class="panel" x="1050" y="96" width="170" height="150" rx="10" stroke="#22c55e" stroke-width="2"/>
  <text class="bn" x="1062" y="118" fill="#22c55e">FASE 6 · ROOT</text>
  <text class="bt" x="1062" y="138">sudo -i</text>
  <text class="bc" x="1062" y="158">id:</text>
  <text class="bc" x="1062" y="176">uid=0(root)</text>
  <text class="bc" x="1062" y="196">sin ficheros</text>
  <text class="bc" x="1062" y="214">de bandera</text>
  <text class="bc" x="1062" y="236" fill="#22c55e">meta cumplida</text>

  <path class="ar" d="M190 171 L222 171"/>
  <path class="ar" d="M396 171 L428 171"/>
  <path class="ar" d="M602 171 L634 171"/>
  <path class="ar" d="M808 171 L840 171"/>
  <path class="ar" d="M1014 171 L1046 171"/>

  <text class="note" x="20" y="278">El pivote no es una vulnerabilidad: es la configuración de sudo. tails puede ejecutar cualquier orden como sonic, y sonic puede ejecutar cualquier orden como cualquiera.</text>

  <!-- cadena de privilegios -->
  <rect class="panel" x="20" y="300" width="1200" height="240" rx="10"/>
  <text class="h" x="36" y="324" fill="#f8fafc" font-size="13" font-weight="700">CADENA DE PRIVILEGIOS — la regla de sudo que hace posible el movimiento lateral</text>
  <rect class="term" x="36" y="336" width="560" height="80" rx="7"/>
  <text class="m" x="50" y="360">$ sudo -l</text>
  <text class="m" x="50" y="382">User tails may run the following commands:</text>
  <text class="bad" x="50" y="402">    (sonic) NOPASSWD: ALL</text>

  <rect class="term" x="624" y="336" width="580" height="80" rx="7"/>
  <text class="m" x="638" y="360">$ sudo -u sonic sudo -l</text>
  <text class="m" x="638" y="382">User sonic may run the following commands:</text>
  <text class="bad" x="638" y="402">    (ALL) NOPASSWD: ALL</text>

  <text class="crit" x="36" y="450">DATO CLAVE</text>
  <text class="note" x="36" y="474">tails NO puede escalar a root directamente: solo puede ejecutar órdenes como sonic. El salto a root requiere pasar antes por sonic.</text>
  <text class="note" x="36" y="496">Por eso la cadena es obligatoriamente de dos saltos, y por eso el primer paso (la credencial) tiene que dar con un usuario que pueda pivotar.</text>
  <text class="note" x="36" y="518">Con NOPASSWD, un único pivote basta: tails → sonic → root, sin volver a introducir ninguna contraseña.</text>
</svg>
